name: Assemble architecture upload

on:
  push:
    branches:
      - architecture-diagram-upload
    paths:
      - 'docs/.architecture-parts/**'
      - '.github/workflows/assemble-architecture-upload.yml'

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble approved architecture image
        shell: bash
        run: |
          set -euo pipefail
          cat docs/.architecture-parts/part*.txt | base64 -d > docs/architecture-overview.webp
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          old = 'docs/architecture-overview.svg'
          new = 'docs/architecture-overview.webp'
          if old not in text:
              raise SystemExit('Expected architecture image reference was not found in README.md')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          test -s docs/architecture-overview.webp
          rm -rf docs/.architecture-parts
          rm -f .github/workflows/assemble-architecture-upload.yml

      - name: Commit architecture image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A README.md docs .github/workflows/assemble-architecture-upload.yml
          git commit -m 'Add polished competition architecture diagram'
          git push
