name: Build technical report

on:
  push:
    branches:
      - main
    paths:
      - scripts/build_technical_report.py

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install report dependencies
        run: pip install reportlab pillow pypdf

      - name: Build and verify report
        run: |
          python scripts/build_technical_report.py
          python - <<'PY'
          from pypdf import PdfReader
          reader = PdfReader('technical-report.pdf')
          assert len(reader.pages) == 2, f'Expected 2 pages, got {len(reader.pages)}'
          print('[OK] technical-report.pdf has 2 pages')
          PY

      - name: Commit generated report
        run: |
          if git diff --quiet -- technical-report.pdf; then
            echo 'technical-report.pdf is already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add technical-report.pdf
          git commit -m 'Regenerate report with pypdf architecture label'
          git push
