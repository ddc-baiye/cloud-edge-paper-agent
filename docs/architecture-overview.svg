  <text x="230" y="570" text-anchor="middle" class="txt">Grammar + Polish</text>
  <text x="230" y="598" text-anchor="middle" class="small">Academic writing assistance</text>
  <rect x="395" y="535" rx="14" ry="14" width="230" height="98" class="box"/>
  <text x="510" y="570" text-anchor="middle" class="txt">Translation</text>
