  <text x="880" y="423" text-anchor="middle" class="txt">Retriever</text><text x="880" y="447" text-anchor="middle" class="small">OPEA MicroService</text>
  <rect x="1070" y="392" rx="13" ry="13" width="220" height="70" class="box"/>
  <text x="1180" y="423" text-anchor="middle" class="txt">Prompt Builder</text><text x="1180" y="447" text-anchor="middle" class="small">OPEA MicroService</text>
