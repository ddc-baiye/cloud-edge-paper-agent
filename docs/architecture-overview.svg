  <rect x="115" y="165" rx="12" ry="12" width="260" height="50" class="box"/><text x="245" y="197" text-anchor="middle" class="txt">Researcher / Reviewer</text>
  <rect x="565" y="165" rx="12" ry="12" width="270" height="50" class="box"/><text x="700" y="197" text-anchor="middle" class="txt">Unified PaperAgent UI</text>
  <rect x="1025" y="165" rx="12" ry="12" width="250" height="50" class="box"/><text x="1150" y="197" text-anchor="middle" class="txt">Nginx Gateway</text>
