<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#273142"/>
    </marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#111827}.subtitle{font:400 16px Arial,sans-serif;fill:#4b5563}
      .group{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.edge{fill:#eef6ff;stroke:#3b82f6;stroke-width:2}.cloud{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.data{fill:#f0fdf4;stroke:#22c55e;stroke-width:2}.box{fill:#fff;stroke:#64748b;stroke-width:1.6}.txt{font:600 18px Arial,sans-serif;fill:#1f2937}.small{font:400 14px Arial,sans-serif;fill:#475569}.line{stroke:#273142;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="820" fill="#ffffff"/>
  <text x="70" y="62" class="title">PaperAgent Cloud-Edge Architecture</text>
