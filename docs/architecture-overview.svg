  <text x="230" y="430" text-anchor="middle" class="txt">Qwen3-8B INT4</text>
  <text x="230" y="457" text-anchor="middle" class="small">OpenVINO GenAI / Intel NPU</text>
  <rect x="395" y="395" rx="14" ry="14" width="230" height="88" class="box"/>
  <text x="510" y="430" text-anchor="middle" class="txt">HY-MT1.5-1.8B</text>
  <text x="510" y="457" text-anchor="middle" class="small">OpenVINO INT4 / CPU</text>

